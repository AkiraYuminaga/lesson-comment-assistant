[package]
name = "lesson_comment_backend"
version = "1.0.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
tower_governor = "0.4"  # 0.5+ requires axum 0.8
governor = "0.6"  # must match tower_governor's governor version

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
dotenvy = "0.15"

# Security & Crypto
secrecy = { version = "0.8", features = ["serde"] }
sha2 = "0.10"
hmac = "0.13"
hex = "0.4"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Input validation
validator = { version = "0.18", features = ["derive"] }
regex = "1.10"
