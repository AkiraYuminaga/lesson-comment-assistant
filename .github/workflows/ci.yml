name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (fmt · clippy · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  extension:
    name: Extension (manifest · syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifest, files and versions
        run: python3 scripts/check-extension.py

      - name: JavaScript syntax
        run: |
          find extension -name '*.js' -print0 | xargs -0 -n1 node --check

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block .env files and Google API keys
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env file is committed"; exit 1
          fi
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- . ':!*.lock'; then
            echo "::error::Google API key found in tracked files"; exit 1
          fi
          echo "no secrets found"
